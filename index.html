<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1a1c2c">
<title>Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1c2c;      /* fundo */
  --win:#29366f;      /* janela */
  --win-hi:#3b5dc9;   /* chanfro claro */
  --win-lo:#16183a;   /* chanfro escuro */
  --edge:#0e0f1d;     /* contorno */
  --cream:#f4f4f4;
  --mute:#94b0c2;
  --gold:#ffcd75;
  --hp:#38b764;--hp-mid:#ffcd75;--hp-low:#b13e53;--xp:#41a6f6;
  --px:"Pixelify Sans",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none;background:var(--ink)}
body{background:var(--ink);color:var(--cream);font-family:var(--px);font-variant-ligatures:none;font-size:15px;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
select{font:inherit;font-size:16px}
img{image-rendering:pixelated}

/* janela chanfrada, estilo menu de portátil */
.win{background:var(--win);border:2px solid var(--edge);box-shadow:inset 2px 2px 0 var(--win-hi),inset -2px -2px 0 var(--win-lo)}
.btn{background:#3b5dc9;border:2px solid var(--edge);box-shadow:inset 2px 2px 0 #73eff7,inset -2px -2px 0 #29366f;padding:8px 12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;line-height:1}
.btn:active{box-shadow:inset 2px 2px 0 #29366f,inset -2px -2px 0 #73eff7;transform:translateY(1px)}
.btn:disabled{filter:grayscale(1) brightness(.7);cursor:default}
.btn.y{background:var(--gold);color:var(--ink);box-shadow:inset 2px 2px 0 #fff3c4,inset -2px -2px 0 #c9884a}
.btn.y:active{box-shadow:inset 2px 2px 0 #c9884a,inset -2px -2px 0 #fff3c4}
.ico{width:24px;height:24px;flex:none}

#app{height:100dvh;max-width:1000px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto auto;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) 0 env(safe-area-inset-left,0)}
/* barra de cima */
#top{display:flex;align-items:center;gap:8px;padding:4px 6px;margin:4px 4px 0}
#area{font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#area small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.stat{display:flex;align-items:center;gap:2px;font-weight:700;font-size:15px}
/* palco */
#stage{position:relative;overflow:hidden;margin:4px 4px 0;border:2px solid var(--edge);min-height:0;touch-action:manipulation}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#target{position:absolute;left:6px;top:6px;display:none;align-items:center;gap:8px;padding:5px 8px 5px 5px;max-width:62%}
#target img{width:40px;height:40px;background:var(--win-lo);border:2px solid var(--edge)}
#target .nm{font-weight:700;font-size:14px;white-space:nowrap}
#feed{position:absolute;left:8px;bottom:8px;right:30%;pointer-events:none;font-size:12px;line-height:1.3;text-shadow:1px 1px 0 var(--edge),-1px 1px 0 var(--edge),1px -1px 0 var(--edge),-1px -1px 0 var(--edge)}
#feed div{transition:opacity .4s}
#throw{position:absolute;right:8px;bottom:8px;display:none}
#coach{position:absolute;left:8px;right:8px;bottom:8px;display:none;align-items:center;gap:10px;padding:10px 10px 10px 12px;font-size:14px;line-height:1.35;z-index:3}
#coach span{flex:1}
#coach .btn{padding:6px 10px;font-size:13px;flex:none}
.qbtn{position:relative;flex:none;width:40px;height:40px;display:grid;place-items:center;background:var(--win-lo);border:2px solid var(--edge)}
.qbtn .ico{width:28px;height:28px}
#qbadge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;background:#b13e53;border:2px solid var(--edge);font-size:11px;font-weight:700;line-height:14px;text-align:center;display:none}
.tab.pulse{animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{background:#3b5dc9}}
@media (prefers-reduced-motion:reduce){.tab.pulse{animation:none;box-shadow:inset 0 0 0 2px var(--gold)}}
.quest{padding:8px 10px;margin-bottom:6px}
.quest .row{font-size:14px}
.quest .bar{margin:6px 0 4px}
.quest.done{opacity:.55}
#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);padding:8px 12px;font-weight:700;display:none;white-space:nowrap;z-index:2}
#center{position:absolute;inset:0;display:none;place-items:center;background:rgba(14,15,29,.78);text-align:center;font-weight:700;font-size:20px;z-index:3}
#center small{display:block;font-size:14px;font-weight:400;color:var(--mute);margin-top:6px}
/* hud */
#hud{margin:4px 4px 0;padding:6px;display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center}
#act{display:grid;grid-template-columns:44px 1fr;gap:4px 10px;align-items:center;min-width:0}
#actPic{grid-row:1/4;width:44px;height:44px;background:var(--win-lo);border:2px solid var(--edge)}
#actPic img{width:100%;height:100%;display:block}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700;min-width:0}
.row span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv{color:var(--gold);font-size:14px;flex:none}
.bar{height:8px;background:var(--edge);border:2px solid var(--edge);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--hp)}
.bar.xp{height:6px}.bar.xp i{background:var(--xp)}
.sub{font-size:12px;color:var(--mute);font-weight:400}
#team{display:flex;gap:4px}
#moves{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.mv{position:relative;overflow:hidden;padding:5px 4px 4px 8px;text-align:left;font-size:11.5px;font-weight:700;line-height:1.1;min-height:38px}
.mv .ty{position:absolute;left:0;top:0;bottom:0;width:4px}
.mv small{display:block;font-weight:400;color:var(--mute);font-size:10.5px;margin-top:2px}
.mv .cdv{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(14,15,29,.72);pointer-events:none}
.mv .s{position:absolute;right:4px;bottom:4px;font-size:13px;color:var(--gold)}
.mv.on{box-shadow:inset 0 0 0 2px var(--gold)}
.mv[disabled]{opacity:.5}
.mini{width:34px;position:relative}
.mini img{width:34px;height:34px;display:block;background:var(--win-lo);border:2px solid var(--edge)}
.mini .bar{height:5px;border-width:1px;margin-top:2px}
.mini.ko img{filter:grayscale(1) brightness(.5)}
.mini.on img{border-color:var(--gold)}
/* abas */
#tabs{position:relative;z-index:6;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin:4px 4px 0;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0 3px;font-size:12px;font-weight:700;min-width:0}
.tab img{width:22px;height:22px}
.tab[aria-selected=true]{background:var(--gold);color:var(--ink);box-shadow:inset 2px 2px 0 #fff3c4,inset -2px -2px 0 #c9884a}
/* painel de baixo */
#sheet{position:fixed;left:0;right:0;bottom:var(--tabsH,72px);max-width:1000px;margin:0 auto;max-height:72dvh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.8,.2,1),visibility .22s;z-index:5;visibility:hidden}
#sheet.open{transform:none;visibility:visible}
#sheetHead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:2px solid var(--edge);font-weight:700;font-size:18px}
#sheetBody{overflow-y:auto;overscroll-behavior:contain;padding:10px 12px 14px}
#scrim{position:fixed;left:0;right:0;top:0;bottom:var(--tabsH,72px);background:rgba(14,15,29,.5);display:none;z-index:4}
h3{font-size:14px;color:var(--gold);margin:12px 0 6px;font-weight:700}
h3:first-child{margin-top:0}
.biome{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:12px}
.tier{display:flex;align-items:center;gap:8px;padding:6px 8px;text-align:left;width:100%}
.tier.cur{background:#3b5dc9}
.tier[disabled]{opacity:.5}
.tier .who{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.tier .who img{width:24px;height:24px}
.tier .who img.no{filter:grayscale(1) brightness(.35)}
.mon{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:6px;margin-bottom:6px}
.mon>img{width:48px;height:48px;background:var(--win-lo);border:2px solid var(--edge)}
.mon .acts{display:flex;flex-direction:column;gap:4px}
.mon .acts .btn{padding:6px 8px;font-size:13px;justify-content:center}
.shop{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:8px;margin-bottom:6px}
.shop img{width:32px;height:32px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:2px solid var(--win-lo)}
.opt:last-child{border:0}
.sw{width:46px;height:26px;background:var(--edge);border:2px solid var(--edge);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:var(--mute);transition:transform .15s}
.sw[aria-checked=true]{background:#257179}
.sw[aria-checked=true]::after{transform:translateX(20px);background:var(--gold)}
.seg{display:flex;gap:4px}
.seg .btn{padding:6px 10px}
.seg .btn[aria-pressed=true]{background:var(--gold);color:var(--ink)}
.note{color:var(--mute);font-size:13px;line-height:1.4}
/* resumo de volta */
#away{position:fixed;inset:0;z-index:8;background:rgba(14,15,29,.82);display:none;place-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
#away .box{width:100%;max-width:420px;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;padding:14px}
.aw{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:2px solid var(--win-lo)}
.aw img{width:40px;height:40px;background:var(--win-lo);border:2px solid var(--edge)}
.aw.hi b{color:var(--gold)}
.awgrid{display:flex;flex-wrap:wrap;gap:4px}.awgrid img{width:36px;height:36px;background:var(--win-lo);border:2px solid var(--edge)}
.boost{color:var(--gold)}
/* escolha do inicial */
#starter{position:fixed;inset:0;z-index:9;background:var(--ink);display:none;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 10px}
#starter .win{padding:12px;overflow-y:auto;flex:1;overscroll-behavior:contain}
.region{font-size:13px;color:var(--gold);margin:12px 0 6px;font-weight:700}
.region:first-child{margin-top:0}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pick{padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:700}
.pick img{width:64px;height:64px}
@media (hover:hover) and (pointer:fine){.btn:hover{filter:brightness(1.1)}.pick:hover{filter:brightness(1.15)}}
@media (min-width:600px){#hud{padding:10px}#act{grid-template-columns:64px 1fr}#actPic{width:64px;height:64px}.mini,.mini img{width:48px}.mini img{height:48px}}
/* mega */
#megaBtn{position:absolute;right:6px;top:6px;display:none;flex-direction:column;align-items:center;gap:0;padding:4px 6px 3px;font-size:11px;font-weight:700;overflow:hidden;z-index:2;min-width:52px}
#megaBtn span{position:relative;z-index:1}
#megaBtn .ico{position:relative;z-index:1;width:22px;height:22px}
#megaFill{position:absolute;left:0;right:0;bottom:0;height:0;background:#5d275d;z-index:0}
#megaBtn.ready{background:var(--gold);color:var(--ink);animation:megaP .7s steps(2) infinite}
#megaBtn.ready #megaFill{display:none}
#megaBtn.on #megaFill{background:#b13e53}
@keyframes megaP{50%{box-shadow:inset 2px 2px 0 #fff3c4,inset -2px -2px 0 #c9884a,0 0 0 3px #f4f4f4}}
@media (prefers-reduced-motion:reduce){#megaBtn.ready{animation:none}}
/* arena */
#pad{position:absolute;inset:0;display:none;z-index:1;touch-action:none;user-select:none;-webkit-user-select:none}
#joy{position:absolute;left:0;bottom:0;width:58%;height:70%}
.pbtn{position:absolute;display:grid;place-items:center;font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#bAtk{right:12px;bottom:14px;width:78px;height:78px;font-size:15px}
#bDodge{right:98px;bottom:18px;width:62px;height:62px;font-size:12px}
#arExit{position:absolute;right:6px;top:6px;padding:5px 9px;font-size:12px}
body.arena #feed{display:none}
body.arena #megaBtn{top:auto;bottom:102px;right:12px;min-width:78px}
.arow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:6px 8px;margin-bottom:6px}
.arow img{width:44px;height:44px;background:var(--win-lo);border:2px solid var(--edge)}
.arow.lock{opacity:.5}
.arow.won .nm{color:var(--gold)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;margin-top:6px}
.keys b{color:var(--gold)}
.hold{padding:3px 6px!important;font-size:12px!important;margin-top:4px}

#spBtn{position:absolute;right:6px;top:66px;display:none;flex-direction:column;align-items:stretch;gap:3px;padding:4px 6px 5px;max-width:118px;z-index:2;overflow:hidden;text-align:left}
#spBtn b{font-size:10.5px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1}
#spBtn small{font-size:10px;color:var(--gold);position:relative;z-index:1}
#spBtn .pips{display:flex;gap:3px;position:relative;z-index:1}
#spBtn .pips i{width:12px;height:7px;background:var(--edge);border:1px solid var(--edge)}
#spBtn .pips i.on{background:var(--gold);box-shadow:0 0 4px var(--gold)}
#spFill{position:absolute;left:0;bottom:0;height:3px;width:0;background:#73eff7}
#spBtn.empty{opacity:.6}
body.arena #spBtn{top:auto;bottom:100px;right:12px;max-width:78px;min-width:78px}
body.arena #megaBtn{top:auto;bottom:90px;right:98px;min-width:62px}
/* arena vista de cima */
body.ax #stage{position:fixed;inset:0;margin:0;z-index:40;border:0;border-radius:0;box-shadow:none}
body.ax #megaBtn,body.ax #spBtn,body.ax #target,body.ax #feed,body.ax #throw,body.ax #center,body.ax #coach{display:none!important}
body.ax #joy{width:50%;height:75%}
.ab{position:absolute;display:grid;place-items:center;align-content:center;gap:0;width:58px;height:58px;padding:2px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ab b{font-size:13px;position:relative;z-index:1}
.ab small{font-size:8.5px;line-height:1;max-width:54px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1;color:var(--cream)}
.ab i{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(14,15,29,.62);z-index:0;pointer-events:none}
.ab.off{opacity:.6}
.ab.ready{background:var(--gold);color:var(--ink);animation:megaP .7s steps(2) infinite}
#abAtk{right:14px;bottom:18px;width:78px;height:78px}#abAtk b{font-size:16px}
#abHab{right:100px;bottom:18px}#abQ{right:22px;bottom:104px}#abUlt{right:92px;bottom:88px}
#abDodge{right:166px;bottom:14px;width:50px;height:50px}#abEvo{right:160px;bottom:76px;width:50px;height:50px}
#axExit{position:absolute;right:6px;top:84px;padding:5px 9px;font-size:12px}
.axsel{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px;margin-bottom:8px;max-height:150px;overflow:auto}
.axp{position:relative;padding:0;border:2px solid var(--edge);background:var(--win-lo);aspect-ratio:1}
.axp img{width:100%;height:100%;display:block}
.axp span{position:absolute;right:1px;bottom:0;font-size:10px;color:var(--cream);text-shadow:1px 1px 0 #000}
.axp.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.axcard{padding:8px;margin-bottom:10px}
.sb{display:grid;grid-template-columns:30px 1fr 34px;gap:6px;align-items:center;font-size:12px;margin-top:3px}
.sb i{height:6px;background:var(--ink);display:block}.sb i b{display:block;height:100%}
.sb em{font-style:normal;text-align:right;color:var(--cream)}
.axmv{display:grid;grid-template-columns:36px 1fr;gap:2px 8px;font-size:12.5px;margin-top:8px}
.axmv b{color:var(--gold)}
.rk{display:grid;place-items:center;width:44px;height:44px;font-weight:700;font-size:20px;color:var(--ink);border:2px solid var(--edge)}

#abBall{right:22px;bottom:180px;display:none}
.hm{display:block;width:100%;margin:-2px 0 8px;padding:6px 8px;font-size:12.5px;text-align:left}
.hmnote{font-size:12.5px;color:var(--mute);margin:0 0 10px}

#toast{max-width:calc(100% - 16px);white-space:normal;text-align:center}

#svPick{position:absolute;inset:0;display:none;align-content:center;justify-items:center;gap:8px;background:rgba(14,15,29,.72);z-index:5;padding:20px}
.svh{color:var(--gold);font-weight:700;font-size:16px;margin-bottom:4px;text-align:center}
.svc{display:grid;gap:2px;padding:10px 14px;width:min(320px,90%);text-align:left}.svc b{font-size:15px}.svc span{font-size:12.5px;color:var(--cream)}

@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header id="top" class="win">
    <button id="qbtn" class="qbtn" aria-label="Missões"><img class="ico" id="icQ" alt=""><span id="qbadge"></span></button>
    <div id="area">Floresta<small>Faixa 1</small></div>
    <div class="stat"><img class="ico" id="icCoin" alt="Ouro"><span id="gold">0</span></div>
    <div class="stat"><img class="ico" id="icBall" alt="Bolas"><span id="balls">0</span></div>
  </header>

  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="target" class="win"><img id="tPic" alt=""><div style="flex:1;min-width:0"><div class="row"><span class="nm" id="tName"></span><span class="lv" id="tLv"></span></div><div class="bar"><i id="tHp"></i></div></div></div>
    <div id="toast" class="win"></div>
    <div id="feed"></div>
    <div id="coach" class="win"><span id="coachTxt"></span><button class="btn" id="coachSkip">Pular</button></div>
    <button id="throw" class="btn y"><img class="ico" id="icThrow" alt=""><span id="throwTxt"></span></button>
    <button id="spBtn" class="btn" aria-label="Especial"><b></b><span class="pips"></span><i id="spFill"></i></button>
    <button id="megaBtn" class="btn" aria-label="Mega evoluir"><img class="ico" id="icMega" alt=""><span>MEGA</span><i id="megaFill"></i></button>
    <div id="pad"></div>
    <div id="center"></div>
  </main>

  <section id="hud" class="win">
    <div id="act">
      <div id="actPic"><img id="aPic" alt=""></div>
      <div class="row"><span id="aName">...</span><span class="lv" id="aLv"></span></div>
      <div class="bar"><i id="aHp"></i></div>
      <div style="display:flex;gap:8px;align-items:center"><div class="bar xp" style="flex:1"><i id="aXp"></i></div><span class="sub" id="aHpT"></span></div>
    </div>
    <div id="team"></div>
    <div id="moves"></div>
  </section>

  <nav id="tabs" role="tablist">
    <button class="tab win" role="tab" data-tab="hunt" aria-selected="true"><img alt="" id="icHunt">Hunt</button>
    <button class="tab win" role="tab" data-tab="mapa" aria-selected="false"><img alt="" id="icMap">Mapa</button>
    <button class="tab win" role="tab" data-tab="equipe" aria-selected="false"><img alt="" id="icTeam">Equipe</button>
    <button class="tab win" role="tab" data-tab="arena" aria-selected="false"><img alt="" id="icArena">Arena</button>
    <button class="tab win" role="tab" data-tab="loja" aria-selected="false"><img alt="" id="icShop">Loja</button>
    <button class="tab win" role="tab" data-tab="ajustes" aria-selected="false"><img alt="" id="icCfg">Ajustes</button>
  </nav>
</div>
<div id="scrim"></div>
<div id="sheet" class="win" role="dialog"><div id="sheetHead"><span id="sheetTitle"></span><button class="btn" id="sheetClose">Fechar</button></div><div id="sheetBody"></div></div>
