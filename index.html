:root{
  --ink:#1a1c2c;      /* fundo */
  --win:#29366f;      /* janela */
  --win-hi:#3b5dc9;   /* chanfro claro */
  --win-lo:#16183a;   /* chanfro escuro */
  --edge:#0e0f1d;     /* contorno */
  --cream:#f4f4f4;
  --mute:#94b0c2;
  --gold:#ffcd75;
  --hp:#38b764;--hp-mid:#ffcd75;--hp-low:#b13e53;--xp:#41a6f6;
  --px:"Pixelify Sans",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none;background:var(--ink)}
body{background:var(--ink);color:var(--cream);font-family:var(--px);font-variant-ligatures:none;font-size:15px;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
select{font:inherit;font-size:16px}
img{image-rendering:pixelated}

/* janela chanfrada, estilo menu de portátil */
.win{background:var(--win);border:2px solid var(--edge);box-shadow:inset 2px 2px 0 var(--win-hi),inset -2px -2px 0 var(--win-lo)}
.btn{background:#3b5dc9;border:2px solid var(--edge);box-shadow:inset 2px 2px 0 #73eff7,inset -2px -2px 0 #29366f;padding:8px 12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;line-height:1}
.btn:active{box-shadow:inset 2px 2px 0 #29366f,inset -2px -2px 0 #73eff7;transform:translateY(1px)}
.btn:disabled{filter:grayscale(1) brightness(.7);cursor:default}
.btn.y{background:var(--gold);color:var(--ink);box-shadow:inset 2px 2px 0 #fff3c4,inset -2px -2px 0 #c9884a}
.btn.y:active{box-shadow:inset 2px 2px 0 #c9884a,inset -2px -2px 0 #fff3c4}
.ico{width:24px;height:24px;flex:none}

#app{height:100dvh;max-width:1000px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto auto;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) 0 env(safe-area-inset-left,0)}
/* barra de cima */
#top{display:flex;align-items:center;gap:8px;padding:4px 6px;margin:4px 4px 0}
#area{font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#area small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.stat{display:flex;align-items:center;gap:2px;font-weight:700;font-size:15px}
/* palco */
#stage{position:relative;overflow:hidden;margin:4px 4px 0;border:2px solid var(--edge);min-height:0;touch-action:manipulation}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#target{position:absolute;left:6px;top:6px;display:none;align-items:center;gap:8px;padding:5px 8px 5px 5px;max-width:62%}
#target img{width:40px;height:40px;background:var(--win-lo);border:2px solid var(--edge)}
#target .nm{font-weight:700;font-size:14px;white-space:nowrap}
#feed{position:absolute;left:8px;bottom:8px;right:30%;pointer-events:none;font-size:12px;line-height:1.3;text-shadow:1px 1px 0 var(--edge),-1px 1px 0 var(--edge),1px -1px 0 var(--edge),-1px -1px 0 var(--edge)}
#feed div{transition:opacity .4s}
#throw{position:absolute;right:8px;bottom:8px;display:none}
#coach{position:absolute;left:8px;right:8px;bottom:8px;display:none;align-items:center;gap:10px;padding:10px 10px 10px 12px;font-size:14px;line-height:1.35;z-index:3}
#coach span{flex:1}
#coach .btn{padding:6px 10px;font-size:13px;flex:none}
.qbtn{position:relative;flex:none;width:40px;height:40px;display:grid;place-items:center;background:var(--win-lo);border:2px solid var(--edge)}
.qbtn .ico{width:28px;height:28px}
#qbadge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;background:#b13e53;border:2px solid var(--edge);font-size:11px;font-weight:700;line-height:14px;text-align:center;display:none}
.tab.pulse{animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{background:#3b5dc9}}
@media (prefers-reduced-motion:reduce){.tab.pulse{animation:none;box-shadow:inset 0 0 0 2px var(--gold)}}
.quest{padding:8px 10px;margin-bottom:6px}
.quest .row{font-size:14px}
.quest .bar{margin:6px 0 4px}
.quest.done{opacity:.55}
#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);padding:8px 12px;font-weight:700;display:none;white-space:nowrap;z-index:2}
#center{position:absolute;inset:0;display:none;place-items:center;background:rgba(14,15,29,.78);text-align:center;font-weight:700;font-size:20px;z-index:3}
#center small{display:block;font-size:14px;font-weight:400;color:var(--mute);margin-top:6px}
/* hud */
#hud{margin:4px 4px 0;padding:6px;display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center}
#act{display:grid;grid-template-columns:44px 1fr;gap:4px 10px;align-items:center;min-width:0}
#actPic{grid-row:1/4;width:44px;height:44px;background:var(--win-lo);border:2px solid var(--edge)}
#actPic img{width:100%;height:100%;display:block}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700;min-width:0}
.row span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv{color:var(--gold);font-size:14px;flex:none}
.bar{height:8px;background:var(--edge);border:2px solid var(--edge);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--hp)}
.bar.xp{height:6px}.bar.xp i{background:var(--xp)}
.sub{font-size:12px;color:var(--mute);font-weight:400}
#team{display:flex;gap:4px}
#moves{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.mv{position:relative;overflow:hidden;padding:5px 4px 4px 8px;text-align:left;font-size:11.5px;font-weight:700;line-height:1.1;min-height:38px}
.mv .ty{position:absolute;left:0;top:0;bottom:0;width:4px}
.mv small{display:block;font-weight:400;color:var(--mute);font-size:10.5px;margin-top:2px}
.mv .cdv{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(14,15,29,.72);pointer-events:none}
.mv .s{position:absolute;right:4px;bottom:4px;font-size:13px;color:var(--gold)}
.mv.on{box-shadow:inset 0 0 0 2px var(--gold)}
.mv[disabled]{opacity:.5}
.mini{width:34px;position:relative}
.mini img{width:34px;height:34px;display:block;background:var(--win-lo);border:2px solid var(--edge)}
.mini .bar{height:5px;border-width:1px;margin-top:2px}
.mini.ko img{filter:grayscale(1) brightness(.5)}
.mini.on img{border-color:var(--gold)}
/* abas */
#tabs{position:relative;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:4px 4px 0;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0 3px;font-size:12px;font-weight:700;min-width:0}
.tab img{width:22px;height:22px}
.tab[aria-selected=true]{background:var(--gold);color:var(--ink);box-shadow:inset 2px 2px 0 #fff3c4,inset -2px -2px 0 #c9884a}
/* painel de baixo */
#sheet{position:fixed;left:0;right:0;bottom:var(--tabsH,72px);max-width:1000px;margin:0 auto;max-height:72dvh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.8,.2,1),visibility .22s;z-index:5;visibility:hidden}
#sheet.open{transform:none;visibility:visible}
#sheetHead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:2px solid var(--edge);font-weight:700;font-size:18px}
#sheetBody{overflow-y:auto;overscroll-behavior:contain;padding:10px 12px 14px}
#scrim{position:fixed;left:0;right:0;top:0;bottom:var(--tabsH,72px);background:rgba(14,15,29,.5);display:none;z-index:4}
h3{font-size:14px;color:var(--gold);margin:12px 0 6px;font-weight:700}
h3:first-child{margin-top:0}
.biome{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:12px}
.tier{display:flex;align-items:center;gap:8px;padding:6px 8px;text-align:left;width:100%}
.tier.cur{background:#3b5dc9}
.tier[disabled]{opacity:.5}
.tier .who{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.tier .who img{width:24px;height:24px}

.dtop{display:flex;gap:12px;align-items:center;padding-right:40px}.dtop img{width:72px;height:72px;flex:none;background:var(--win-lo);border:2px solid #0e0f1d}
.dtop h2{font-size:20px;margin:2px 0}.dtop small{font-size:14px;color:var(--cream)}
.dbars{display:grid;gap:4px;margin:12px 0}
.st{display:grid;grid-template-columns:62px 1fr 64px;gap:8px;align-items:center;font-size:12px}.st i{display:block;height:8px;background:#0e0f1d}.st u{display:block;height:100%;background:#a7f070;text-decoration:none}.st b{text-align:right}
.dsec{display:grid;gap:5px;padding:10px 0;border-top:2px solid #0e0f1d}.dsec>b{font-size:14px;color:var(--gold)}
.mvl{display:flex;flex-wrap:wrap;gap:5px}.mvc{font-size:12px;padding:3px 7px;border:2px solid;background:var(--win-lo)}
.dacts{display:grid;gap:6px;margin-top:10px}.dacts .btn{padding:10px;font-size:14px}
.cbox{width:min(360px,100%);padding:16px;display:grid;gap:10px;animation:dup .18s ease-out}.cbox h3{margin:0;font-size:18px}
.cbody p{margin:6px 0 0;font-size:14px}.cone{display:flex;gap:10px;align-items:center}.cone img{width:48px;height:48px}
.cmany{display:flex;flex-wrap:wrap;gap:3px;align-items:center}.cmany img{width:32px;height:32px}
.cwarn{margin:0;padding:8px;font-size:13px;background:rgba(177,62,83,.25);border:2px solid #b13e53}
.cacts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cacts .btn{padding:10px;font-size:15px}

@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header id="top" class="win">
    <button id="qbtn" class="qbtn" aria-label="Missões"><img class="ico" id="icQ" alt=""><span id="qbadge"></span></button>
    <button id="trChip" class="trc" aria-label="Nível do treinador"><b id="trLv">1</b><i><u id="trBar"></u></i></button>
    <div id="area">Floresta<small>Faixa 1</small></div>
    <div class="stat"><img class="ico" id="icCoin" alt="Ouro"><span id="gold">0</span></div>
    <div class="stat"><img class="ico" id="icBall" alt="Bolas"><span id="balls">0</span></div>
  </header>

  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="target" class="win"><img id="tPic" alt=""><div style="flex:1;min-width:0"><div class="row"><span class="nm" id="tName"></span><span class="lv" id="tLv"></span></div><div class="bar"><i id="tHp"></i></div></div></div>
    <div id="toast" class="win"></div>
    <div id="feed"></div>
    <div id="coach" class="win"><span id="coachTxt"></span><button class="btn" id="coachSkip">Pular</button></div>
    <button id="throw" class="btn y"><img class="ico" id="icThrow" alt=""><span id="throwTxt"></span></button>
    <button id="spBtn" class="btn" aria-label="Especial"><b></b><span class="pips"></span><i id="spFill"></i></button>
    <button id="megaBtn" class="btn" aria-label="Mega evoluir"><img class="ico" id="icMega" alt=""><span>MEGA</span><i id="megaFill"></i></button>
    <div id="pad"></div>
    <div id="center"></div>
  </main>

  <section id="hud" class="win">
    <div id="act">
      <div id="actPic"><img id="aPic" alt=""></div>
      <div class="row"><span id="aName">...</span><span class="lv" id="aLv"></span></div>
      <div class="bar"><i id="aHp"></i></div>
      <div style="display:flex;gap:8px;align-items:center"><div class="bar xp" style="flex:1"><i id="aXp"></i></div><span class="sub" id="aHpT"></span></div>
    </div>
    <div id="team"></div>
    <div id="moves"></div>
  </section>

  <nav id="tabs" role="tablist">
    <button class="tab win" role="tab" data-tab="hunt" aria-selected="true"><img alt="" id="icHunt">Hunt</button>
    <button class="tab win" role="tab" data-tab="jogar" aria-selected="false"><img alt="" id="icMap">Jogar</button>
    <button class="tab win" role="tab" data-tab="equipe" aria-selected="false"><img alt="" id="icTeam">Equipe</button>
    <button class="tab win" role="tab" data-tab="loja" aria-selected="false"><img alt="" id="icShop">Loja</button>
    <button class="tab win" role="tab" data-tab="ajustes" aria-selected="false"><img alt="" id="icCfg">Ajustes</button>
  </nav>
</div>
<div id="scrim"></div>
<div id="sheet" class="win" role="dialog"><div id="sheetHead"><span id="sheetTitle"></span><button class="btn" id="sheetClose">Fechar</button></div><div id="sheetBody"></div></div>
<div id="away"><div class="win box"><div style="font-weight:700;font-size:20px;margin-bottom:4px">Enquanto você estava fora</div><p class="note" id="awayTime" style="margin-bottom:10px"></p><div id="awayBody"></div><button class="btn y" id="awayOk" style="width:100%;justify-content:center;margin-top:12px;padding:12px">Coletar</button></div></div>
<div id="starter"><div class="win"><div style="font-weight:700;font-size:20px;margin-bottom:4px">Escolha seu inicial</div><p class="note" style="margin-bottom:10px">Os iniciais de todas as regiões estão liberados.</p><div id="stList"></div></div></div>

<div id="boot" style="position:fixed;inset:0;z-index:50;background:#1a1c2c;display:grid;place-items:center"><div class="win" style="padding:16px;width:min(320px,86vw)"><p style="font-weight:700;margin-bottom:10px">Carregando Pokémon...</p><div class="bar"><i style="width:0%;background:var(--gold)"></i></div></div></div>
<script>
(function(){const el=document.getElementById('boot'),bar=el.querySelector('i');let n=0;const tot=3;const step=()=>{n++;bar.style.width=(100*n/tot)+'%'};
  const Q=/github\.io$/.test(location.hostname)?'?v=15':'';const L=s=>new Promise(r=>{const i=new Image();i.onload=()=>{step();r(i)};i.onerror=()=>{step();r(i)};i.src=s+Q});
  Promise.all([L('pt.png'),L('pts.png')]).then(ims=>{window.PTIMG=ims;const s=document.createElement('script');s.src='game.js'+Q;s.onload=()=>{step();el.remove()};
    s.onerror=()=>{el.querySelector('p').textContent='Não foi possível carregar o jogo. Confira a internet e recarregue.'};document.body.appendChild(s)})})();
</script>
</body>
</html>
